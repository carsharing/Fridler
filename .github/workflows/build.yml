name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build IPA
        run: scripts/build-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Fridler-ipa
          path: build/Fridler.ipa
          if-no-files-found: error

      - name: Tests and snapshots
        run: scripts/test.sh

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: Snapshots/Output
          if-no-files-found: ignore

      - name: Publish snapshots branch
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-snapshots.sh

      # A version in project.yml without a release yet gets tagged and
      # released from this commit. Bumping MARKETING_VERSION ships it.
      - name: Release new version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(scripts/version.sh)"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "$VERSION is already released"
            exit 0
          fi
          scripts/release-notes.sh "$VERSION" > build/release-notes.md
          gh release create "$VERSION" build/Fridler.ipa \
            --target "$GITHUB_SHA" \
            --title "Fridler $VERSION" \
            --notes-file build/release-notes.md
